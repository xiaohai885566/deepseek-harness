name: Deploy to Cloudflare

# Manual only: a deployment builds a multi-gigabyte container image and starts a
# paid container instance, so it never runs on push. Trigger it from the Actions
# tab once the repository secrets exist:
#   CLOUDFLARE_API_TOKEN   Workers Scripts:Edit, Containers:Edit, Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the container application
#   DEEPSEEK_API_KEY       model credential pushed as a Worker secret
on:
  workflow_dispatch:
    inputs:
      basic_auth:
        description: 'Optional user:password gate in front of the deployment'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    name: wrangler deploy
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      # Wrangler builds the image with the runner's Docker daemon and pushes the
      # layers itself; no registry credentials are needed for the Cloudflare one.
      - name: Verify Docker
        run: docker info >/dev/null

      - name: Store secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BASIC_AUTH: ${{ inputs.basic_auth }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo '::error::DEEPSEEK_API_KEY repository secret is not set'
            exit 1
          fi
          printf '%s' "$DEEPSEEK_API_KEY" | npx --yes wrangler@4 secret put DEEPSEEK_API_KEY
          if [ -n "${BASIC_AUTH:-}" ]; then
            printf '%s' "$BASIC_AUTH" | npx --yes wrangler@4 secret put DSH_BASIC_AUTH
          fi

      - name: Deploy Worker and container image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Summarize
        run: |
          {
            echo '### Deployed'
            echo
            echo 'The first request starts the container; expect a cold start of one to three minutes.'
            echo 'Open `https://<your-worker-url>/__dsh/launch` once to exchange the launch token for a session cookie.'
          } >> "$GITHUB_STEP_SUMMARY"
